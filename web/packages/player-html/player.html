<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ruffle Player SA</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
    <style>
        html {
            color-scheme: light dark;
        }

        html,
        body,
        #parent-div {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #player-div {
            position: absolute;
            background-color: black;
            overflow: hidden;
            left: 0;
            top: 0;
        }

        #create-player-div,
        #create-player-div>table,
        #create-player-div>table>tr {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        #file-select {
            visibility: hidden;
            opacity: 0;
            display: none;
        }
    </style>
</head>

<body>
    <div id="parent-div">
        <div id="player-div">
            <!-- create-player-div will be removed when generating player html -->
            <div id="create-player-div" hidden>
                <table>
                    <tr>
                        <td>
                            Ruffle Player SA
                            <br />
                            <button id="button-play">Play File</button>
                            <button id="button-create">Create Player</button>
                            <br />
                            <select id="mobile-select">
                                <option value="NONE">No Rotation</option>
                                <option value="PORT">Portrait Rotation</option>
                                <option value="LAND">Landscape Rotation</option>
                            </select>
                        </td>
                    </tr>
                </table>
                <input type="file" id="file-select" />
            </div>
        </div>
    </div>
    <script>window.onerror = function (e) { alert("JavaScript Error:" + e) }</script>
    <script>
        // some browsers does not have AudioBuffer.prototype.getChannelData
        if (typeof AudioBuffer !== "undefined" &&
            typeof AudioBuffer.prototype.getChannelData !== "function") {

            var fake = new WeakMap();
            Object.defineProperty(AudioBuffer.prototype, "getChannelData", {
                configurable: true,
                writable: true,
                value: function (ch) {
                    if (ch < 0 || ch >= this.numberOfChannels)
                        throw new DOMException("IndexSizeError", "IndexSizeError");
                    var arrs = fake.get(this);
                    if (!arrs) {
                        arrs = Array.from({ length: this.numberOfChannels },
                            () => new Float32Array(this.length));
                        fake.set(this, arrs);
                    }
                    return arrs[ch];
                },
            });
        }
    </script>
    <!-- RufflePlayerDynSrc is used only to bypass file: origin check in panic.tsx -->
    <script>window.RufflePlayerDynSrc = (b, a) => a + b;</script>
    <!-- swf-script will be dynamically generated by player -->
    <script id="swf-script">window.RufflePlayerSwf = [0, ""]</script>
    <!-- rotate-script will be dynamically changed and "MOBILE_ROTATE_NONE" will be replaced in inline_html.js -->
    <script id="rotate-script">window.RufflePlayerRotate = "MOBILE_ROTATE_NONE"</script>
    <!-- ruffle.js will be replaced by inline_html.js -->
    <script src="ruffle.js"></script>
    <script>
            (() => {
                var parentDiv = document.getElementById("parent-div");
                var playerDiv = document.getElementById("player-div");
                var createPlayerDiv = document.getElementById("create-player-div");
                var playButton = document.getElementById("button-play");
                var createButton = document.getElementById("button-create");
                var rotationSelect = document.getElementById("mobile-select");
                var fileInput = document.getElementById("file-select");
                function onResize() {
                    var { width, height } = parentDiv.getBoundingClientRect();
                    var MOBILE_ROTATE = window.RufflePlayerRotate;
                    if (MOBILE_ROTATE == "LAND") {
                        if (width >= height) {
                            playerDiv.style.width = width + "px";
                            playerDiv.style.height = height + "px";
                            playerDiv.style.transform = "none";
                        } else {
                            playerDiv.style.width = height + "px";
                            playerDiv.style.height = width + "px";
                            playerDiv.style.transform = `rotate(90deg) translate(${height / 2 - width / 2}px,${height / 2 - width / 2}px)`;
                        }
                    } else if (MOBILE_ROTATE == "PORT") {
                        if (width <= height) {
                            playerDiv.style.width = width + "px";
                            playerDiv.style.height = height + "px";
                            playerDiv.style.transform = "none";
                        } else {
                            playerDiv.style.width = height + "px";
                            playerDiv.style.height = width + "px";
                            playerDiv.style.transform = `rotate(-90deg) translate(${width / 2 - height / 2}px,${width / 2 - height / 2}px)`;
                        }
                    } else {
                        playerDiv.style.width = width + "px";
                        playerDiv.style.height = height + "px";
                        playerDiv.style.transform = "none";
                    }
                }
                onResize();
                new ResizeObserver(onResize).observe(parentDiv);
                if (rotationSelect) {
                    rotationSelect.value = window.RufflePlayerRotate;
                    rotationSelect.addEventListener("change", () => {
                        window.RufflePlayerRotate = rotationSelect.value;
                        onResize();
                        document.getElementById("rotate-script").innerHTML = "window.RufflePlayerRotate=" + JSON.stringify(rotationSelect.value);
                    });
                }
                var player = window.RufflePlayer.newest().createPlayer();
                playerDiv.appendChild(player);
                player.style.width = player.style.height = "100%";
                var ruffle = player.ruffle();
                var onLoaded = () => { };
                player.addEventListener("loadedmetadata", () => onLoaded());
                function loadPlayerUrl(url) {
                    ruffle.load({ autoplay: "on", unmuteOverlay: "hidden", url: url });
                }
                function loadPlayer() {
                    loadPlayerUrl(RufflePlayerDecodeSwf(window.RufflePlayerSwf));
                }
                if (window.RufflePlayerSwf[0]) {
                    if (createPlayerDiv) createPlayerDiv.hidden = true;
                    loadPlayer();
                    return;
                } else {
                    createPlayerDiv.hidden = false;
                }
                var onFileSelect;
                var pendingDownload = false;
                fileInput.addEventListener("change", () => onFileSelect());
                function selectFile() {
                    fileInput.click();
                }
                function onFileSelectPlay() {
                    createPlayerDiv.hidden = true;
                    loadPlayerUrl(URL.createObjectURL(new Blob([fileInput.files[0]], { type: "application/x-shockwave-flash" })));
                }
                function onFileSelectCreate() {
                    var reader = new FileReader();
                    reader.onload = () => {
                        var array = new Uint8Array(reader.result);
                        createPlayerDiv.hidden = true;
                        onLoaded = () => {
                            if (ruffle.metadata) {
                                ruffle.suspend();
                                document.getElementById("swf-script").textContent = "window.RufflePlayerSwf=" + JSON.stringify(window.RufflePlayerEncodeSwf(array));
                                createPlayerDiv.hidden = false;
                                playButton.hidden = true;
                                pendingDownload = true;
                                createButton.textContent = "Download Player";
                                var downloaded = false;
                                createButton.addEventListener("click", () => {
                                    if (!downloaded) {
                                        createPlayerDiv.hidden = true;
                                        playerDiv.removeChild(player);
                                        playerDiv.removeChild(createPlayerDiv);
                                        let url = URL.createObjectURL(new Blob(["<!DOCTYPE html>" + document.documentElement.outerHTML]));
                                        let link = document.createElement("a");
                                        link.download = "player.html";
                                        link.href = url;
                                        document.body.appendChild(link);
                                        link.click();
                                        downloaded = true;
                                        playerDiv.appendChild(createPlayerDiv);
                                        playerDiv.appendChild(player);
                                        createPlayerDiv.hidden = false;
                                        createButton.textContent = "Close Window";
                                    } else {
                                        close();
                                    }
                                });
                            }
                        };
                        loadPlayerUrl(URL.createObjectURL(new Blob([array], { type: "application/x-shockwave-flash" })));
                    };
                    reader.readAsArrayBuffer(fileInput.files[0]);
                }
                createButton.addEventListener("click", () => {
                    if (!pendingDownload) {
                        onFileSelect = onFileSelectCreate;
                        onLoaded = () => { };
                        selectFile();
                    }
                });
                playButton.addEventListener("click", () => {
                    onFileSelect = onFileSelectPlay;
                    onLoaded = () => { };
                    selectFile();
                });
            })();
    </script>
</body>

</html>
